name: M1 Django and Docker Compose foundation

on:
  pull_request:
    paths:
      - ".github/workflows/django-compose-smoke.yml"
      - "app/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - "compose.yaml"
      - "compose.tunnel.yaml"
      - "compose.existing-tunnel.host.yaml"
      - "compose.existing-tunnel.docker.yaml"
      - ".env.example"
      - "scripts/verify_tunnel_compose.py"
      - "scripts/verify_existing_tunnel_compose.py"
      - "scripts/vps_readonly_inventory.sh"
      - "scripts/smoke_offline_catalog.py"
      - "scripts/postgres_backup.sh"
      - "scripts/verify_postgres_backup.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/django-compose-smoke.yml"
      - "app/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - "compose.yaml"
      - "compose.tunnel.yaml"
      - "compose.existing-tunnel.host.yaml"
      - "compose.existing-tunnel.docker.yaml"
      - ".env.example"
      - "scripts/verify_tunnel_compose.py"
      - "scripts/verify_existing_tunnel_compose.py"
      - "scripts/vps_readonly_inventory.sh"
      - "scripts/smoke_offline_catalog.py"
      - "scripts/postgres_backup.sh"
      - "scripts/verify_postgres_backup.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel_config:
    name: Cloudflare Tunnel production configuration (no token/network required)
    runs-on: ubuntu-latest
    # No real Cloudflare account/token is used here. Only merged Compose config.
    env:
      POSTGRES_PASSWORD: "ci-only-not-secret-db-password"
      DJANGO_SECRET_KEY: "ci-only-not-secret-django-key"
      CLOUDFLARE_TUNNEL_TOKEN: "ci-only-tunnel-placeholder-never-valid"
      FOOTBALLSTUDIO_ORIGIN_PORT: "18080"
      CLOUDFLARE_EXISTING_NETWORK: "footballstudio_tunnel"
    steps:
      - uses: actions/checkout@v5
      - name: Compose version and production overlay safety checks
        run: |
          set -euo pipefail
          docker compose version
          docker compose -f compose.yaml -f compose.tunnel.yaml config --format json |
            python scripts/verify_tunnel_compose.py
          # The private token is mandatory: no tunnel must start with no credential.
          if env -u CLOUDFLARE_TUNNEL_TOKEN docker compose -f compose.yaml -f compose.tunnel.yaml config --quiet >/dev/null 2>&1; then
            echo "ERROR: tunnel configuration accepted a missing token." >&2
            exit 1
          fi
          # The existing ap-pixels connector needs no new cloudflared service.
          # Validate BOTH alternatives without a VPS or real Cloudflare account.
          bash -n scripts/vps_readonly_inventory.sh
          docker compose -f compose.yaml -f compose.existing-tunnel.host.yaml config --format json |
            python scripts/verify_existing_tunnel_compose.py host
          docker compose -f compose.yaml -f compose.existing-tunnel.docker.yaml config --format json |
            python scripts/verify_existing_tunnel_compose.py docker
          # Refuse accidental fallback to 8000 or an unspecified external net.
          if env -u FOOTBALLSTUDIO_ORIGIN_PORT docker compose -f compose.yaml -f compose.existing-tunnel.host.yaml config --quiet >/dev/null 2>&1; then
            echo "ERROR: host connector overlay accepted unspecified origin port" >&2
            exit 1
          fi
          if env -u CLOUDFLARE_EXISTING_NETWORK docker compose -f compose.yaml -f compose.existing-tunnel.docker.yaml config --quiet >/dev/null 2>&1; then
            echo "ERROR: docker connector overlay accepted unspecified external bridge" >&2
            exit 1
          fi
          # Validate that we can still start the original local-only stack.
          docker compose -f compose.yaml config --quiet

  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOW_SQLITE: "1"
      DJANGO_SECRET_KEY: "ci-only-insecure-key-do-not-use-in-deployment"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run
      - name: HTTP / readiness tests (SQLite test database)
        run: python manage.py test app.studio app.accounts app.clubs app.production --verbosity=2

  offline_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOW_SQLITE: "1"
      DJANGO_SECRET_KEY: "ci-only-live-catalog-test-not-for-deployment"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: "Verify offline FIFA 211, UEFA 55 and roster snapshots"
        run: python scripts/smoke_offline_catalog.py

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Generate unique throwaway CI credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from secrets import token_hex
          Path(".env").write_text(
              "DJANGO_SECRET_KEY=" + token_hex(48) + "\n"
              "POSTGRES_PASSWORD=" + token_hex(24) + "\n"
              "POSTGRES_DB=footballstudio\n"
              "POSTGRES_USER=footballstudio\n"
              "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\n"
              "DJANGO_DEBUG=0\n"
              "DJANGO_TRUST_PROXY=0\n"
              "APP_PORT=8000\n"
          )
          PY
      - name: Validate Compose and build/start isolated services
        run: |
          docker compose version
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 150
      - name: Verify HTTP, PostgreSQL, migrations and Django tests
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz/ | grep -qx "ok"
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py makemigrations --check --dry-run
          docker compose exec -T web python manage.py migrate --noinput
          docker compose exec -T web python manage.py seed_world_catalog
          docker compose exec -T web python manage.py test app.studio app.accounts app.clubs app.production --verbosity=1
      - name: Check PostgreSQL data survives database restart
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U footballstudio -d footballstudio -c "CREATE TABLE IF NOT EXISTS fs_m1_volume_check (id int PRIMARY KEY);"
          docker compose exec -T db psql -U footballstudio -d footballstudio -c "INSERT INTO fs_m1_volume_check (id) VALUES (1) ON CONFLICT DO NOTHING;"
          docker compose restart db
          success=0
          for i in $(seq 1 30); do
            if docker compose exec -T db psql -U footballstudio -d footballstudio -tAc "SELECT COUNT(*) FROM fs_m1_volume_check;" 2>/dev/null | grep -qx "1"; then
              success=1
              break
            fi
            sleep 2
          done
          test "$success" -eq 1
      - name: Verify PostgreSQL backup and isolated restore (test marker survives)
        run: |
          set -euo pipefail
          bash -n scripts/postgres_backup.sh
          bash -n scripts/verify_postgres_backup.sh
          docker compose exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE fs_m1_backup_restore_probe (id integer PRIMARY KEY); INSERT INTO fs_m1_backup_restore_probe (id) VALUES (42);"' >/dev/null
          archive="$(bash scripts/postgres_backup.sh)"
          test -s "$archive"
          bash scripts/verify_postgres_backup.sh "$archive" fs_m1_backup_restore_probe 1
          docker compose exec -T db sh -c 'psql -X -q -A -t -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT id FROM fs_m1_backup_restore_probe;"' | grep -qx 42
          rm -f -- "$archive"
      - name: Verify production Tunnel web health using the real Compose overlay
        env:
          # Intentionally invalid placeholder: do NOT launch cloudflared in CI.
          CLOUDFLARE_TUNNEL_TOKEN: "ci-fake-never-valid"
        run: |
          set -euo pipefail
          # Reconfigure ONLY the web container to production settings; reuse
          # the running test database and never connect to Cloudflare.
          docker compose -f compose.yaml -f compose.tunnel.yaml up -d --no-deps --wait --wait-timeout 120 web
          docker compose -f compose.yaml -f compose.tunnel.yaml exec -T web python -c "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host':'studio2.ap-pixels.com'}); res=urllib.request.urlopen(req,timeout=3); assert res.status==200 and res.read()==b'ok'"
          # Ensure the HTTPS origin has not published any host ports.
          docker compose -f compose.yaml -f compose.tunnel.yaml config --format json |
            python scripts/verify_tunnel_compose.py
      - name: Print safe troubleshooting diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 --no-color
      - name: Remove temporary CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
