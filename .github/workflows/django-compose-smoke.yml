name: M1 Django and Docker Compose foundation

on:
  pull_request:
    paths:
      - ".github/workflows/django-compose-smoke.yml"
      - "app/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - "compose.yaml"
      - ".env.example"
      - "scripts/smoke_live_catalog.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/django-compose-smoke.yml"
      - "app/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - "compose.yaml"
      - ".env.example"
      - "scripts/smoke_live_catalog.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOW_SQLITE: "1"
      DJANGO_SECRET_KEY: "ci-only-insecure-key-do-not-use-in-deployment"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run
      - name: HTTP / readiness tests (SQLite test database)
        run: python manage.py test app.studio app.accounts app.clubs app.production --verbosity=2

  live_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOW_SQLITE: "1"
      DJANGO_SECRET_KEY: "ci-only-live-catalog-test-not-for-deployment"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: "Verify live no-key catalog: top two leagues in England and Germany"
        run: python scripts/smoke_live_catalog.py

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Generate unique throwaway CI credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from secrets import token_hex
          Path(".env").write_text(
              "DJANGO_SECRET_KEY=" + token_hex(48) + "\n"
              "POSTGRES_PASSWORD=" + token_hex(24) + "\n"
              "POSTGRES_DB=footballstudio\n"
              "POSTGRES_USER=footballstudio\n"
              "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\n"
              "DJANGO_DEBUG=0\n"
              "DJANGO_TRUST_PROXY=0\n"
              "APP_PORT=8000\n"
          )
          PY
      - name: Validate Compose and build/start isolated services
        run: |
          docker compose version
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 150
      - name: Verify HTTP, PostgreSQL, migrations and Django tests
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz/ | grep -qx "ok"
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py makemigrations --check --dry-run
          docker compose exec -T web python manage.py migrate --noinput
          docker compose exec -T web python manage.py test app.studio app.accounts app.clubs app.production --verbosity=1
      - name: Check PostgreSQL data survives database restart
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U footballstudio -d footballstudio -c "CREATE TABLE IF NOT EXISTS fs_m1_volume_check (id int PRIMARY KEY);"
          docker compose exec -T db psql -U footballstudio -d footballstudio -c "INSERT INTO fs_m1_volume_check (id) VALUES (1) ON CONFLICT DO NOTHING;"
          docker compose restart db
          success=0
          for i in $(seq 1 30); do
            if docker compose exec -T db psql -U footballstudio -d footballstudio -tAc "SELECT COUNT(*) FROM fs_m1_volume_check;" 2>/dev/null | grep -qx "1"; then
              success=1
              break
            fi
            sleep 2
          done
          test "$success" -eq 1
      - name: Print safe troubleshooting diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 --no-color
      - name: Remove temporary CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
