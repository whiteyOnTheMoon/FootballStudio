# Dedicated production tunnel named footballstudio, NOT a replica of other projects.
# Cloudflare route studio2.ap-pixels.com -> http://web:8000.
# Create a new remotely-managed Cloudflare tunnel and save only its new token
# in the private .env as CLOUDFLARE_TUNNEL_TOKEN.
# docker compose -f compose.yaml -f compose.tunnel.yaml up -d --build --wait
services:
  web:
    # Do NOT publish Gunicorn on the VPS, not even on loopback, in tunnel mode.
    # Cloudflare is the only ingress; the DB stays on the private default network.
    ports: !reset []
    networks:
      - default
      - tunnel_frontend
    environment:
      DJANGO_ALLOWED_HOSTS: "studio2.ap-pixels.com"
      DJANGO_DEBUG: "0"
      DJANGO_LOCAL_HTTP: "0"
      DJANGO_TRUST_PROXY: "1"
      DJANGO_FORCE_HTTPS: "1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://studio2.ap-pixels.com"
      # Keep HSTS disabled until a live HTTPS check succeeds.
      DJANGO_HSTS_SECONDS: "${DJANGO_HSTS_SECONDS:-0}"

    # Probe a private local TCP socket while presenting the externally
    # allowed Django Host. This is NOT an additional public host binding.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host':'studio2.ap-pixels.com'}); response=urllib.request.urlopen(req,timeout=3); assert response.status==200 and response.read()==b'ok'"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Use only the NEW footballstudio token; never copy other tunnel tokens.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the private .env}"
    networks:
      - tunnel_frontend
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

networks:
  tunnel_frontend:
